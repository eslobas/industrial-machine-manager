name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.17.6
      - run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-analytics.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -W error
      - name: Data pipeline smoke test (synthetic data -> Parquet)
        run: |
          python -m scripts.gerar_dados_demo --db demo.db --ate 2026-11-24
          python -m analytics.pipeline --db demo.db --out saida --hoje 2026-11-24
          python -c "import polars as pl; k = pl.read_parquet('saida/kpis.parquet'); print(k); assert k['registos'][0] > 0"

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: industrial-machine-manager-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name api -p 8000:8000 industrial-machine-manager-api:ci
      - name: Wait until healthy
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Smoke test the API
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/health
          id=$(curl -fsS -X POST localhost:8000/manutencoes \
                 -H 'content-type: application/json' \
                 -d '{"nome_maquina":"CI","data_manutencao":"2026-01-01","dias_para_proxima":7}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS "localhost:8000/manutencoes/$id"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/manutencoes/999999)" = 404
      - name: Container logs
        if: always()
        run: docker logs api || true
